name: Koi

on:
  schedule:
    # Just after midnight UTC, so the koi shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/koi.yml]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the reviewed v1.0.2 commit instead of the movable v1 tag.
      - uses: yalongwastaken/git-koi@7305e9b1fadee6f43d3b4fa543a25d4cde79856e # v1.0.2
        with:
          body: white
          output-dir: koi

      - name: Commit the koi if it changed
        run: |
          git add koi/koi.gif koi/koi.png
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name github-actions
          git config user.email actions@github.com
          git commit --quiet -m "koi: draw the day's koi"
          # The stats workflow also pushes to main; rebase in case it ran first.
          git pull --rebase --quiet
          git push --quiet
